<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaunderLab — investigator workbench</title>
<style>
  /* Tier colors run a warm ramp (rust -> orange -> ochre -> sand), deepest and
     most saturated for the strongest evidence tier, faintest for the weakest --
     the color itself now echoes the tier note text ("highest hit rate" ->
     "no layer could name a reason"). Each of the 8 tier values (light + dark)
     was picked by measuring WCAG contrast against ITS OWN background and panel,
     not carried over from the other theme: text needs >=4.5:1 to stay readable,
     and re-using a light-mode color unchanged in dark mode is exactly the bug
     that shipped here before -- tier1-3 measured at 2.8-3.6:1 against the dark
     background, well under the readable threshold, and nobody had checked. */
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #14140f; --muted: #6b6b63;
    --line: #e3e2da; --accent: #185fa5;
    --tier1: #ce4027; --tier2: #ac5c15; --tier3: #916c22; --tier4: #8d6a53;
    --critical: #a32d2d; --high: #b45309; --medium: #7a6a1f; --low: #5f5e5a;
    --mark: #fdf3d0; --markline: #d9b74a;
  }
  :root[data-theme="dark"] {
    --bg: #161614; --panel: #1e1e1b; --ink: #f2f1ea; --muted: #9d9c92;
    --line: #32312c; --accent: #6ea8e6;
    --tier1: #dd614b; --tier2: #da741b; --tier3: #c6942f; --tier4: #a68168;
    --mark: #3a3218; --markline: #8a7328;
  }
  /* No explicit choice yet: follow the OS, but still fully theme every token --
     the same reasoning applies whether dark mode was chosen or merely inherited. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --panel: #1e1e1b; --ink: #f2f1ea; --muted: #9d9c92;
      --line: #32312c; --accent: #6ea8e6;
      --tier1: #dd614b; --tier2: #da741b; --tier3: #c6942f; --tier4: #a68168;
      --mark: #3a3218; --markline: #8a7328;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55
         system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 26px 14px; border-bottom: 1px solid var(--line);
           display: flex; justify-content: space-between; align-items: flex-start;
           gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0 0 3px; font-size: 19px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  main { padding: 20px 26px 60px; max-width: 1200px; }
  .headctl { display: flex; align-items: flex-start; gap: 14px; }
  .whoami { font-size: 12px; color: var(--muted); text-align: right; }
  .whoami input { font: inherit; font-size: 13px; color: var(--ink); padding: 5px 9px;
                  border: 1px solid var(--line); border-radius: 6px;
                  background: var(--panel); width: 170px; }
  /* theme toggle -- the top-right corner control. Which icon shows is decided
     in JS (setThemeIcon), not CSS: the effective theme depends on either an
     explicit choice OR the OS preference, and computing that in one JS
     function is simpler and less error-prone than reproducing the same
     light/dark/unset logic across several CSS selector combinations. */
  #theme-toggle { width: 32px; height: 32px; padding: 0; display: flex;
                  align-items: center; justify-content: center; flex: none; }
  #theme-toggle svg { width: 17px; height: 17px; stroke: var(--ink); fill: none;
                       stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #theme-toggle .moon { display: none; }
  #theme-toggle.is-dark .sun { display: none; }
  #theme-toggle.is-dark .moon { display: block; }
  .stats { display: flex; flex-wrap: wrap; gap: 22px; margin-bottom: 22px; }
  .stat b { display: block; font-size: 21px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase;
               letter-spacing: .04em; }
  .tier { margin-bottom: 26px; }
  .tier h2 { font-size: 14px; margin: 0 0 3px; font-weight: 600; }
  .tier p { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; }
  .t1 h2 { color: var(--tier1); } .t2 h2 { color: var(--tier2); }
  .t3 h2 { color: var(--tier3); } .t4 h2 { color: var(--tier4); }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line);
           font-size: 13.5px; vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
       color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  #queue tbody tr { cursor: pointer; }
  #queue tbody tr:hover { background: rgba(24,95,165,.07); }
  .score { font-variant-numeric: tabular-nums; font-weight: 600; }
  .band { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .band.critical { color: var(--critical); } .band.high { color: var(--high); }
  .band.medium { color: var(--medium); } .band.low { color: var(--low); }
  .why { color: var(--muted); font-size: 12.5px; }
  .empty { padding: 14px; color: var(--muted); font-size: 13px; background: var(--panel);
           border: 1px dashed var(--line); border-radius: 8px; }
  dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
           color: var(--ink); max-width: 980px; width: 94%; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dhead { padding: 16px 20px; border-bottom: 1px solid var(--line);
           display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .dbody { padding: 16px 20px; max-height: 74vh; overflow: auto; }
  .dbody h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
              color: var(--muted); margin: 18px 0 7px; }
  .dbody h3:first-child { margin-top: 0; }
  .sig { border-left: 3px solid var(--accent); padding: 3px 0 3px 10px; margin-bottom: 7px;
         font-size: 13px; }
  .sig em { color: var(--muted); font-style: normal; font-size: 11px;
            text-transform: uppercase; letter-spacing: .04em; }
  .ev { font-size: 13px; padding: 5px 0; border-bottom: 1px dotted var(--line); }
  .ev .meta { color: var(--muted); font-size: 11.5px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: transparent; color: var(--ink); }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button[disabled] { opacity: .45; cursor: not-allowed; }
  .err { color: var(--critical); }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 11px 18px; background: var(--panel); border: 1px solid var(--line);
        border-radius: 8px; padding: 12px 14px; }
  .kv span { display: block; color: var(--muted); font-size: 11px;
             text-transform: uppercase; letter-spacing: .04em; }
  .kv b { font-weight: 600; font-size: 13.5px; }
  .scroll { overflow-x: auto; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cr { color: var(--tier1); } .dr { color: var(--critical); }
  .note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  /* link graph (7.6) */
  .chainbox { border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px 2px;
              margin-bottom: 10px; background: var(--panel); }
  .chainbox .caption { color: var(--muted); font-size: 12px; padding: 4px 8px 8px; }
  .node { cursor: pointer; }
  .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
  .node.here rect { stroke: var(--accent); stroke-width: 2.5; }
  .node:hover rect { stroke: var(--accent); }
  .node .aid { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .node .nm { font-size: 10.5px; fill: var(--muted); }
  .hop { cursor: pointer; }
  .hop line { stroke: var(--tier1); stroke-width: 2; }
  .hop:hover line { stroke: var(--accent); }
  .hop text { font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
  .hop:hover text { fill: var(--accent); }
  /* statement rows that ARE the network evidence */
  tr.evidence td { background: var(--mark); }
  tr.evidence td:first-child { box-shadow: inset 3px 0 0 var(--markline); }
  tr.focused td { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* disposition workflow (7.7) */
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .form { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px;
          padding: 12px 14px; background: var(--panel); }
  .form label { display: block; font-size: 11px; text-transform: uppercase;
                letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
  .form select, .form textarea, .form input { font: inherit; font-size: 13.5px; width: 100%;
        padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
        background: var(--bg); color: var(--ink); margin-bottom: 10px; }
  .form textarea { min-height: 62px; resize: vertical; }
  .msg { font-size: 13px; margin-top: 8px; }
  /* SAR narrative (7.8) */
  pre.sar { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
            padding: 14px 16px; overflow-x: auto; font: 12.5px/1.5 ui-monospace,
            "Cascadia Mono", Consolas, monospace; white-space: pre; margin: 0; }
</style>
</head>
<body>
<header>
  <div>
    <h1>LaunderLab — investigator workbench</h1>
    <div class="sub">Alert queue, tiered by evidence. Highest-precision work first.</div>
  </div>
  <div class="headctl">
    <div class="whoami">
      <label for="analyst">Signed in as</label><br>
      <input id="analyst" placeholder="your name" autocomplete="off"
             oninput="rememberAnalyst()">
      <div class="sub" id="who-note">Required — every action is recorded against a name.</div>
    </div>
    <button id="theme-toggle" onclick="toggleTheme()" title="Switch theme"
            aria-label="Switch between light and dark theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5"></circle>
        <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3
                 M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"></path>
      </svg>
    </button>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div id="queue"><div class="empty">Loading queue…</div></div>
</main>

<dialog id="detail">
  <div class="dhead">
    <div><strong id="d-title">Case</strong><div class="sub" id="d-sub"></div></div>
    <button onclick="document.getElementById('detail').close()">Close</button>
  </div>
  <div class="dbody">
    <div id="d-case"></div>
    <div id="d-entity"></div>
  </div>
</dialog>

<script>
// Slice 7.1 measured that a single list sorted by the blended score does NOT
// rank better than the best single layer, so the queue is split by what KIND of
// evidence exists rather than by one number. Order mirrors `risk.TIER_ORDER`,
// which is the one place that fact lives.
//
// Ordered by how specific a reason the analyst gets: graph names a path, a rule
// names a scenario, screening names a listed person, and the model names nothing
// at all — it only ranks. 7.1's standalone precisions (graph 1.000, rules 0.72,
// ML 0.60, screening 0.250) are context in the descriptions, not the ordering:
// they measure each layer as a lone ranker, and using them here put every
// sanctions hit that was also model-ranked under a heading claiming a model
// found it. Both mistakes only became visible once the demo world planted
// watchlist entities and screening fired for the first time.
const TIERS = [
  { key: "graph", cls: "t1", title: "Tier 1 — network evidence",
    note: "Account sits in a reconstructed pass-through chain. Highest hit rate (1.000 "
        + "precision when measured alone); work these first." },
  { key: "rules", cls: "t2", title: "Tier 2 — rule alerts",
    note: "A named monitoring scenario fired. Explainable in one sentence." },
  { key: "screening", cls: "t3", title: "Tier 3 — sanctions / PEP match",
    note: "The customer's name resembles a listed entity. A different question from the "
        + "tiers above: this finds sanctioned identities, not laundering behaviour, which "
        + "is why 7.1 measured it at only 0.250 precision for laundering risk." },
  { key: "ml",    cls: "t4", title: "Tier 4 — model-ranked",
    note: "No layer could name a reason, but the model ranks this account among the most "
        + "unusual in the bank. Broadest reach, and the only tier with no sentence to give "
        + "an analyst.",
    // An empty tier reads as "nothing unusual today". Here that would be false:
    // the ml weight is 0.15, so a model-only case tops out at 15.0 while cases
    // open at 20.0 — it cannot appear by arithmetic, whatever the model found.
    emptyNote: "Empty by arithmetic, not because the bank is quiet: with the model weighted "
             + "at 0.15 a model-only case scores at most 15.0 of 100, below the threshold at "
             + "which a case opens at all. Model scores still lift accounts another layer "
             + "already flagged. Letting this tier fill is a deliberate re-weighting "
             + "decision — and it is the tier that matters most against an adversary who has "
             + "learned to evade the named scenarios." },
];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const money = (n) => "₹" + Number(n).toLocaleString("en-IN",
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const shortMoney = (n) => "₹" + Number(n).toLocaleString("en-IN",
  { maximumFractionDigits: 0 });
const when = (ts) => ts ? String(ts).replace("T", " ").slice(0, 16) : "—";

// What the dialog is currently showing. Actions re-render from this rather than
// re-deriving what the user clicked three interactions ago.
let current = { kase: null, entity: null };

// ---------------------------------------------------------------------- theme
// Every color token in this page is defined for BOTH themes explicitly (see the
// :root and :root[data-theme="dark"] blocks) so switching can never land on an
// unstyled or low-contrast combination -- there is no partial theme state to
// fall into. The toggle only decides WHICH complete set applies.
function effectiveTheme() {
  const explicit = localStorage.getItem("launderlab.theme");
  if (explicit === "light" || explicit === "dark") return explicit;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme() {
  const theme = effectiveTheme();
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme-toggle").classList.toggle("is-dark", theme === "dark");
}
function toggleTheme() {
  localStorage.setItem("launderlab.theme", effectiveTheme() === "dark" ? "light" : "dark");
  applyTheme();
}

// -------------------------------------------------------------------- identity
// The case store refuses anonymous mutations and the API refuses to invent a
// default (7.3), so the UI has to know who is working. Kept in localStorage
// because retyping your name for every note is how people start sharing a login.
function analyst() { return document.getElementById("analyst").value.trim(); }
function rememberAnalyst() {
  localStorage.setItem("launderlab.analyst", analyst());
  document.getElementById("who-note").textContent = analyst()
    ? "Actions will be recorded against this name."
    : "Required — every action is recorded against a name.";
}

// ------------------------------------------------------------------- transport
async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let detail = `${response.status} ${response.statusText}`;
    try {
      const body = await response.json();
      if (body.detail) {
        detail = typeof body.detail === "string"
          ? body.detail
          : body.detail.map(d => d.msg || JSON.stringify(d)).join("; ");
      }
    } catch (_) { /* not JSON — keep the status line */ }
    const error = new Error(detail);
    error.status = response.status;
    throw error;
  }
  return response;
}
const getJSON = (path) => api(path).then(r => r.json());
const post = (path, payload) => api(path, {
  method: "POST", headers: { "content-type": "application/json" },
  body: JSON.stringify(payload),
}).then(r => r.json());

// ----------------------------------------------------------------- the queue
function tierOf(kase) {
  const sources = new Set((kase.signals || []).map(s => s.source));
  // First match wins, in measured-precision order — so a case with both a chain
  // and a name match is worked as network evidence, which is the stronger of the
  // two. The fallback is the LAST tier, never a mid-list one: an unrecognised
  // signal source must not be silently filed under "the model said so".
  for (const tier of TIERS) if (sources.has(tier.key)) return tier.key;
  return TIERS[TIERS.length - 1].key;
}

function topSignal(kase) {
  const best = (kase.signals || [])[0];
  return best ? best.detail : "—";
}

async function load() {
  let queue, health;
  try {
    [queue, health] = await Promise.all([
      getJSON("/queue?limit=200"),
      getJSON("/health"),
    ]);
  } catch (err) {
    document.getElementById("queue").innerHTML =
      `<div class="empty err">Could not reach the API: ${esc(err.message)}</div>`;
    return;
  }

  document.getElementById("stats").innerHTML = [
    ["Open cases", queue.length],
    ["Accounts", (health.accounts ?? 0).toLocaleString()],
    ["Transactions", (health.transactions ?? 0).toLocaleString()],
    ["Cases on record", (health.cases ?? 0).toLocaleString()],
  ].map(([label, value]) =>
    `<div class="stat"><b>${esc(value)}</b><span>${esc(label)}</span></div>`).join("");

  const grouped = Object.fromEntries(TIERS.map(t => [t.key, []]));
  queue.forEach(k => grouped[tierOf(k)].push(k));

  document.getElementById("queue").innerHTML = TIERS.map(tier => {
    const rows = grouped[tier.key];
    const body = rows.length ? `<table><thead><tr>
        <th style="width:74px">Risk</th><th style="width:96px">Band</th>
        <th style="width:150px">Account</th><th style="width:190px">Customer</th>
        <th>Top signal</th><th style="width:110px">Status</th></tr></thead><tbody>
      ${rows.map(k => `<tr onclick="openCase(${k.case_id})">
        <td class="score">${esc(k.risk_score.toFixed(1))}</td>
        <td class="band ${esc(k.risk_band)}">${esc(k.risk_band)}</td>
        <td>${esc(k.account_id)}</td>
        <td>${esc(k.customer_name || "—")}</td>
        <td class="why">${esc(topSignal(k))}</td>
        <td>${esc(k.status)}${k.assigned_to ? `<br><span class="why">${esc(k.assigned_to)}</span>` : ""}</td>
        </tr>`).join("")}
      </tbody></table>`
      : `<div class="empty">No cases in this tier.${tier.emptyNote
            ? ` ${esc(tier.emptyNote)}` : ""}</div>`;
    return `<section class="tier ${tier.cls}">
      <h2>${esc(tier.title)} — ${rows.length}</h2>
      <p>${esc(tier.note)}</p>${body}</section>`;
  }).join("");
}

// ------------------------------------------------------------ entity 360 (7.5)
// The alert says an account is suspicious; adjudicating it needs the customer
// behind it. Four things at once, which is the shape of the actual job: who they
// are (KYC), what the account has done in total, who they moved money with, and
// the transactions themselves.

function kv(pairs) {
  return `<div class="kv">${pairs.map(([label, value, cls]) =>
    `<div><span>${esc(label)}</span><b class="${cls || ""}">${value}</b></div>`).join("")}</div>`;
}

function renderProfile(e) {
  return `<h3>Customer</h3>` + kv([
    ["Name", esc(e.full_name)],
    ["Customer", esc(e.customer_id)],
    ["Segment", esc(e.segment)],
    ["City", esc(e.city || "—")],
    ["KYC level", esc(e.kyc_level)],
    ["Risk rating", esc(e.risk_rating), `band ${esc(e.risk_rating)}`],
    ["Account", `${esc(e.account_id)} (${esc(e.account_type)})`],
    ["Account status", esc(e.status)],
  ]);
}

function renderActivity(e) {
  const s = e.summary;
  const balance = e.transactions.length ? money(e.transactions[0].balance_after) : "—";
  // Every figure here is computed server-side over the WHOLE history. Summing
  // the transaction list in the browser would silently under-report any account
  // with more rows than the fetch limit.
  return `<h3>Activity (whole history)</h3>` + kv([
    ["Transactions", esc(s.transaction_count.toLocaleString())],
    ["Total credits", `<span class="cr">${money(s.total_credit)}</span>`],
    ["Total debits", `<span class="dr">${money(s.total_debit)}</span>`],
    ["Current balance", balance],
    ["First activity", esc(when(s.first_activity))],
    ["Last activity", esc(when(s.last_activity))],
  ]);
}

// ------------------------------------------------------- link-graph view (7.6)
// Phase 5's headline was that a chain does not exist in any one account's
// history, only in the edges between accounts — so a list of account ids is the
// wrong shape to show it in. Drawn as the path the money took, with every node
// clickable, because the next question an investigator has after "this account
// is in a chain" is always "who are the others".
//
// Hand-written SVG rather than a graph library: it is a path, laid out left to
// right, and nothing about that needs a force-directed layout engine or a
// megabyte of JavaScript in a page whose whole point is that it has no build.

const NODE_W = 138, NODE_H = 46, GAP = 78, PAD = 10;

function chainSvg(chain, here, chainIndex) {
  const n = chain.accounts.length;
  const width = n * NODE_W + (n - 1) * GAP + PAD * 2;
  const height = NODE_H + 46;
  const y = 30;

  const nodes = chain.accounts.map((account, i) => {
    const x = PAD + i * (NODE_W + GAP);
    const name = chain.names[i] || "—";
    const isHere = account === here;
    return `<g class="node ${isHere ? "here" : ""}"
       onclick="openAccount('${esc(account)}')">
      <title>${esc(name)} — open this account</title>
      <rect x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}" rx="7"></rect>
      <text class="aid" x="${x + NODE_W / 2}" y="${y + 19}" text-anchor="middle">${esc(account)}</text>
      <text class="nm" x="${x + NODE_W / 2}" y="${y + 34}" text-anchor="middle">${esc(
        name.length > 20 ? name.slice(0, 19) + "…" : name)}</text>
    </g>`;
  }).join("");

  const hops = chain.amounts.map((amount, i) => {
    const x1 = PAD + i * (NODE_W + GAP) + NODE_W;
    const x2 = x1 + GAP;
    const mid = (x1 + x2) / 2;
    return `<g class="hop" onclick="focusHop(${chainIndex}, ${i})">
      <title>Show the two ledger rows behind this hop</title>
      <line x1="${x1 + 4}" y1="${y + NODE_H / 2}" x2="${x2 - 10}" y2="${y + NODE_H / 2}"
            marker-end="url(#arrow)"></line>
      <text x="${mid}" y="${y + NODE_H / 2 - 8}">${esc(shortMoney(amount))}</text>
      <rect x="${x1}" y="${y + 6}" width="${GAP}" height="${NODE_H - 12}" fill="transparent"></rect>
    </g>`;
  }).join("");

  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}"
      role="img" aria-label="pass-through chain of ${n} accounts">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
        markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--tier1)"></path>
    </marker></defs>${hops}${nodes}</svg>`;
}

function renderChains(e) {
  if (!e.chains.length) {
    return `<h3>Money chains</h3><div class="empty">This account is not in any
      reconstructed pass-through chain. Note that only counterparties who bank
      here leave an edge — Phase 5 measured that 5 of 6 typologies are invisible
      to the graph for exactly that reason.</div>`;
  }
  return `<h3>Money chains (${e.chains.length})</h3>` + e.chains.map((c, i) => `
    <div class="chainbox">
      <div class="scroll">${chainSvg(c, e.account_id, i)}</div>
      <div class="caption">${esc(c.hops)} hops · ${money(c.amounts[0])} entering ·
        ${esc((c.retained * 100).toFixed(0))}% retained ·
        ${esc(when(c.started))} → ${esc(when(c.ended))} ·
        click an account to open it, or an arrow to find its rows below</div>
    </div>`).join("");
}

/** Highlight and scroll to the statement row behind one hop of one chain. */
function focusHop(chainIndex, hopIndex) {
  const chain = current.entity.chains[chainIndex];
  const pair = chain.hop_txns[hopIndex] || [];
  document.querySelectorAll("tr.focused").forEach(tr => tr.classList.remove("focused"));
  // Only one leg of a hop lives on the account being viewed — the DR if this
  // account paid, the CR if it received. Whichever is here is the row to show.
  let first = null;
  for (const txnId of pair) {
    const row = document.getElementById(`txn-${txnId}`);
    if (row) { row.classList.add("focused"); first = first || row; }
  }
  if (first) {
    first.scrollIntoView({ block: "center", behavior: "smooth" });
    say("");
    return;
  }
  // A hop between two OTHER accounts has no leg on this statement. Silence here
  // reads as a broken click, so name the reason and point at the way forward.
  const from = chain.accounts[hopIndex], to = chain.accounts[hopIndex + 1];
  say(`That hop is ${from} → ${to}; neither leg is on this account's statement. `
      + `Click either account above to open it.`);
}

// Adverse media is shown here and NOWHERE in the score. Slice 7.12 measured it as
// a scoring input: of 21 accounts it flagged, one was laundering, and the set of
// laundering accounts only media reaches was empty — so no weighting could add a
// true positive, while every weighting pushed real cases out of the alert budget.
// It is still the first thing an analyst wants when adjudicating, so it belongs on
// the screen, clearly labelled as context rather than evidence.
function renderMedia(e) {
  const items = e.adverse_media || [];
  if (!items.length) return "";
  return `<h3>Adverse media (${items.length})</h3>` + items.map(m => `
    <div class="chain">
      <div>${esc(m.headline)}</div>
      <div class="sub">${esc(m.category.replace(/_/g, " "))} ·
        name match ${esc(m.score.toFixed(2))} · article ${esc(m.article_id)}</div>
    </div>`).join("")
    + `<p class="note">Context, not evidence: this does not contribute to the risk
       score. A name match to a news story is a lead about an <em>identity</em>,
       and 7.12 measured that it adds no laundering recall — the customer may
       simply share a name with someone in the news.</p>`;
}

function renderStatement(e) {
  if (!e.transactions.length) {
    return `<h3>Statement</h3><div class="empty">No transactions on this account.</div>`;
  }
  // Rows that a reconstructed chain was built from. This is not a second
  // detector in the UI: these are the exact ledger ids Phase 5 paired into the
  // edges, carried through the API, so the highlight can never disagree with the
  // chain drawn above it.
  const evidence = new Set(e.chains.flatMap(c => c.hop_txns.flat()));
  const shown = e.transactions.length;
  const total = e.summary.transaction_count;
  const caption = shown < total
    ? `<p class="note">Showing the latest ${esc(shown.toLocaleString())} of
       ${esc(total.toLocaleString())} transactions.</p>` : "";
  const legend = evidence.size
    ? `<p class="note">Highlighted rows are the transfers a money chain above was
       reconstructed from.</p>` : "";
  return `<h3>Statement — newest first</h3><div class="scroll"><table><thead><tr>
      <th style="width:118px">When</th><th style="width:44px">Dir</th>
      <th style="width:64px">Channel</th><th class="num" style="width:118px">Amount</th>
      <th style="width:170px">Counterparty</th><th>Narration</th>
      <th class="num" style="width:118px">Balance</th></tr></thead><tbody>
    ${e.transactions.map(t => `<tr id="txn-${t.txn_id}"
      class="${evidence.has(t.txn_id) ? "evidence" : ""}">
      <td>${esc(when(t.ts))}</td>
      <td class="${t.direction === "CR" ? "cr" : "dr"}">${esc(t.direction)}</td>
      <td>${esc(t.channel)}</td>
      <td class="num ${t.direction === "CR" ? "cr" : "dr"}">${money(t.amount)}</td>
      <td>${esc(t.counterparty_name || "—")}</td>
      <td class="why">${esc(t.narration)}</td>
      <td class="num">${money(t.balance_after)}</td></tr>`).join("")}
    </tbody></table></div>${legend}${caption}`;
}

// --------------------------------------------------- disposition workflow (7.7)
// The four endpoints already existed; what was missing was the part where a
// human decides. Dispositions are fetched from /dispositions rather than
// hardcoded here, because a UI that invents its own vocabulary quietly destroys
// the disposition statistics a regulator samples.

let DISPOSITIONS = {};

function renderActions(kase) {
  const closed = kase.status === "closed";
  const buttons = closed
    ? `<button class="primary" onclick="showForm('reopen')">Reopen</button>`
    : `<button onclick="assignToMe()">Assign to me</button>
       <button onclick="showForm('note')">Add note</button>
       <button class="primary" onclick="showForm('close')">Close case…</button>`;
  return `<h3>Actions</h3>
    <div class="actions">${buttons}
      <button onclick="showNarrative(${kase.case_id})">Draft SAR narrative</button>
    </div>
    <div id="d-form"></div>
    <div class="msg" id="d-msg"></div>`;
}

function say(message, isError) {
  // The message line lives in the case actions block, which the account view
  // does not have — a status message must never be the thing that throws.
  const box = document.getElementById("d-msg");
  if (!box) return;
  box.className = "msg" + (isError ? " err" : "");
  box.textContent = message;
}

function showForm(kind) {
  const box = document.getElementById("d-form");
  if (kind === "note") {
    box.innerHTML = `<div class="form">
      <label for="f-note">Case note</label>
      <textarea id="f-note" placeholder="What did you check, and what did you find?"></textarea>
      <button class="primary" onclick="doNote()">Save note</button>
      <button onclick="hideForm()">Cancel</button></div>`;
  } else if (kind === "close") {
    box.innerHTML = `<div class="form">
      <label for="f-disp">Disposition</label>
      <select id="f-disp">${Object.entries(DISPOSITIONS).map(([key, meaning]) =>
        `<option value="${esc(key)}">${esc(key)} — ${esc(meaning)}</option>`).join("")}</select>
      <label for="f-rationale">Rationale</label>
      <textarea id="f-rationale" placeholder="Why this decision? A disposition without a rationale is not defensible."></textarea>
      <button class="primary" onclick="doClose()">Close case</button>
      <button onclick="hideForm()">Cancel</button></div>`;
  } else if (kind === "reopen") {
    box.innerHTML = `<div class="form">
      <label for="f-reason">Reason for reopening</label>
      <textarea id="f-reason" placeholder="What changed? The earlier decision stays in the record."></textarea>
      <button class="primary" onclick="doReopen()">Reopen case</button>
      <button onclick="hideForm()">Cancel</button></div>`;
  }
}
function hideForm() { document.getElementById("d-form").innerHTML = ""; say(""); }

function requireAnalyst() {
  if (analyst()) return true;
  say("Enter your name at the top right first — the case store refuses anonymous changes.", true);
  document.getElementById("analyst").focus();
  return false;
}

/** Run a mutation, then re-read the case so the screen shows the record, not a guess. */
async function act(fn, successMessage) {
  if (!requireAnalyst()) return;
  try {
    await fn();
    hideForm();
    await openCase(current.kase.case_id, { keepScroll: true });
    say(successMessage);
    load();
  } catch (err) {
    // 7.3 mapped lifecycle violations to 409 precisely so this branch can say
    // something true: the record moved under you, nothing is broken.
    say(err.status === 409
      ? `${err.message} — someone else may have worked this case. Reopen it from the queue to see the current state.`
      : err.message, true);
  }
}

const assignToMe = () => act(
  () => post(`/cases/${current.kase.case_id}/assign`,
             { actor: analyst(), analyst: analyst() }),
  "Assigned.");

const doNote = () => {
  const note = document.getElementById("f-note").value.trim();
  if (!note) return say("A note needs some text.", true);
  return act(() => post(`/cases/${current.kase.case_id}/notes`,
                        { actor: analyst(), note }), "Note added.");
};

const doClose = () => {
  const disposition = document.getElementById("f-disp").value;
  const rationale = document.getElementById("f-rationale").value.trim();
  if (!rationale) return say("A disposition without a rationale is not defensible.", true);
  return act(() => post(`/cases/${current.kase.case_id}/close`,
                        { actor: analyst(), disposition, rationale }),
             `Closed as ${disposition}.`);
};

const doReopen = () => {
  const reason = document.getElementById("f-reason").value.trim();
  if (!reason) return say("Say why it is being reopened — that becomes part of the record.", true);
  return act(() => post(`/cases/${current.kase.case_id}/reopen`,
                        { actor: analyst(), reason }), "Reopened.");
};

// ------------------------------------------------------- SAR narrative (7.8)
async function showNarrative(caseId) {
  const box = document.getElementById("d-form");
  box.innerHTML = `<div class="form">Drafting…</div>`;
  try {
    const text = await api(`/cases/${caseId}/narrative`).then(r => r.text());
    box.innerHTML = `<div class="form">
      <div class="actions" style="margin-bottom:10px">
        <button class="primary" onclick="copyNarrative()">Copy to clipboard</button>
        <button onclick="hideForm()">Hide</button>
      </div>
      <pre class="sar" id="sar-text">${esc(text)}</pre></div>`;
    say("");
  } catch (err) {
    box.innerHTML = "";
    say(err.message, true);
  }
}

function copyNarrative() {
  const text = document.getElementById("sar-text").textContent;
  navigator.clipboard.writeText(text)
    .then(() => say("Narrative copied. It is a draft — verify every figure before filing."))
    .catch(() => say("Could not reach the clipboard; select the text and copy manually.", true));
}

// ------------------------------------------------------------------- the views

/** Fill the entity panel for one account. Shared by the case and account views. */
async function loadEntity(accountId) {
  const panel = document.getElementById("d-entity");
  panel.innerHTML = `<h3>Customer</h3><div class="empty">Loading customer 360…</div>`;
  try {
    // Ask for the API's maximum window, not its default. A structuring alert on
    // this world reads "89 cash deposits", and at the default 100 rows the
    // statement started a week AFTER the account did — the analyst could not see
    // the run the rule fired on. Truncating the evidence out of the evidence
    // screen is the same failure 7.4 found in the score.
    // ponytail: 500 is the endpoint's ceiling. An account busier than that still
    // truncates, and says so in the caption; paginate when a world produces one.
    const entity = await getJSON(
      `/accounts/${encodeURIComponent(accountId)}?transaction_limit=500`);
    current.entity = entity;
    panel.innerHTML = renderProfile(entity) + renderActivity(entity)
      + renderChains(entity) + renderMedia(entity) + renderStatement(entity);
  } catch (err) {
    panel.innerHTML = `<h3>Customer</h3>
      <div class="empty err">Could not load the entity view: ${esc(err.message)}</div>`;
  }
}

async function openCase(caseId, options) {
  const dialog = document.getElementById("detail");
  const [kase, timeline] = await Promise.all([
    getJSON(`/cases/${caseId}`),
    getJSON(`/cases/${caseId}/timeline`),
  ]);
  current.kase = kase;

  document.getElementById("d-title").textContent =
    `Case ${kase.case_id} — ${kase.customer_name || kase.account_id}`;
  document.getElementById("d-sub").textContent =
    `${kase.account_id} · risk ${kase.risk_score.toFixed(1)} (${kase.risk_band}) · ${kase.status}`
    + (kase.assigned_to ? ` · ${kase.assigned_to}` : "")
    + (kase.disposition ? ` · ${kase.disposition}` : "");

  document.getElementById("d-case").innerHTML = `
    <h3>Why it was flagged</h3>
    ${kase.signals.length
      ? kase.signals.map(s => `<div class="sig"><em>${esc(s.source)}</em><br>${esc(s.detail)}</div>`).join("")
      : `<div class="empty">No evidence recorded.</div>`}
    ${renderActions(kase)}
    <h3>Audit trail</h3>
    ${timeline.map(e => `<div class="ev"><div>${esc(e.detail)}</div>
       <div class="meta">${esc(e.event_type)} · ${esc(e.actor)} ·
       ${esc(String(e.ts).replace("T", " ").slice(0, 19))}</div></div>`).join("")}`;

  if (!dialog.open) dialog.showModal();
  // Back to the top for each case. Working the queue means open, scroll into the
  // statement, close, open the next — and without this the next customer opens
  // mid-statement, below their own evidence and profile. This has to come AFTER
  // showModal(): a closed dialog is not rendered, and scrollTop on an unrendered
  // element is silently a no-op.
  if (!(options && options.keepScroll)) dialog.querySelector(".dbody").scrollTop = 0;

  // Show the case immediately, then fill the customer picture in: entity 360
  // rebuilds the transfer graph, so it is the slowest call on the page and the
  // analyst should not wait on it to read the evidence they clicked for.
  await loadEntity(kase.account_id);
}

/** Open an account that may have no case at all — clicked from a chain. */
async function openAccount(accountId) {
  const dialog = document.getElementById("detail");
  current.kase = null;
  document.getElementById("d-title").textContent = `Account ${accountId}`;
  document.getElementById("d-sub").textContent = "Opened from a money chain";
  document.getElementById("d-case").innerHTML =
    `<div class="empty">Checking for an open case on this account…</div>`;
  if (!dialog.open) dialog.showModal();
  dialog.querySelector(".dbody").scrollTop = 0;

  await loadEntity(accountId);

  // A hop in a chain frequently has no case of its own — the mule in the middle
  // may score below the queue's cut-off. Say so plainly rather than showing an
  // empty panel, and offer the case if there is one.
  const openCases = (current.entity && current.entity.open_cases) || [];
  document.getElementById("d-title").textContent =
    `${(current.entity && current.entity.full_name) || accountId}`;
  document.getElementById("d-sub").textContent =
    `${accountId} · opened from a money chain`;
  document.getElementById("d-case").innerHTML = openCases.length
    ? `<h3>Cases on this account</h3><div class="actions">${openCases.map(id =>
        `<button class="primary" onclick="openCase(${id})">Open case ${esc(id)}</button>`).join(" ")}</div>`
    : `<h3>Cases on this account</h3><div class="empty">No case is open on this
        account. An account can sit in a detected chain without being alerted in
        its own right — a mule in the middle often scores below the queue's
        cut-off.</div>`;
}

// ------------------------------------------------------------------- start-up
applyTheme();
// No explicit choice stored: keep following the OS live, so a mid-session OS
// theme change doesn't leave the toggle icon (set once, above) out of sync
// with the CSS (which is already OS-reactive via the media query).
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (!localStorage.getItem("launderlab.theme")) applyTheme();
});

document.getElementById("analyst").value =
  localStorage.getItem("launderlab.analyst") || "";
rememberAnalyst();
getJSON("/dispositions").then(d => { DISPOSITIONS = d; }).catch(() => {});
load();
</script>
</body>
