[project]
name = "launderlab"
version = "0.1.0"
description = "An open adversarial simulation range for AML detection — synthetic bank, typology injector, detection stack, and a co-evolving red team."
requires-python = ">=3.12"
dependencies = ["duckdb>=1.0", "jellyfish>=1.0", "networkx>=3.0", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
mcp = ["mcp>=1.28"]
# Only the LSTM and GraphSAGE families need this. Install the CPU build --
# pip install torch --index-url https://download.pytorch.org/whl/cpu -- which is
# ~200MB against ~2.5GB for the CUDA one, and these models are far too small to
# benefit from a GPU. Tests skip cleanly when it is absent.
deep = ["torch>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"launderlab.db" = ["*.sql", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# pinned explicitly so a ruff upgrade can't silently widen CI's lint scope
select = ["E4", "E7", "E9", "F"]
