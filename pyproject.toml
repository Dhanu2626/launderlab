[project]
name = "launderlab"
version = "0.1.0"
description = "An open adversarial simulation range for AML detection — synthetic bank, typology injector, detection stack, and a co-evolving red team."
requires-python = ">=3.12"
dependencies = ["duckdb>=1.0", "jellyfish>=1.0", "networkx>=3.0", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Capped at <2 deliberately. `mcp_server.py` imports `mcp.server.fastmcp`, which
# is the 1.x path; mcp 2.0.0 moved it. With an open upper bound a fresh install
# resolved to 2.0.0, the import failed, and because the test module guards itself
# with `pytest.importorskip` the whole MCP server silently dropped out of the test
# run -- and the README's documented `pip install -e ".[mcp]"` produced a server
# that could not start. Found in CI on 2026-07-30 only because the job began
# failing on skips; before that it looked like a pass. Lift the cap when the code
# is migrated to the 2.x API, not before.
mcp = ["mcp>=1.28,<2"]
# The investigator workbench backend. Optional so the detection stack stays
# installable without a web server; the API tests skip cleanly when absent.
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
# Only the LSTM and GraphSAGE families need this. Install the CPU build --
# pip install torch --index-url https://download.pytorch.org/whl/cpu -- which is
# ~200MB against ~2.5GB for the CUDA one, and these models are far too small to
# benefit from a GPU. Tests skip cleanly when it is absent.
deep = ["torch>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"launderlab.db" = ["*.sql", "*.json"]
"launderlab.workbench.static" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# pinned explicitly so a ruff upgrade can't silently widen CI's lint scope
select = ["E4", "E7", "E9", "F"]
