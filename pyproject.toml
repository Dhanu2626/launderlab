[project]
name = "launderlab"
version = "0.1.0"
description = "An open adversarial simulation range for AML detection — synthetic bank, typology injector, detection stack, and a co-evolving red team."
requires-python = ">=3.12"
dependencies = ["duckdb>=1.0", "jellyfish>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
mcp = ["mcp>=1.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"launderlab.db" = ["*.sql", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# pinned explicitly so a ruff upgrade can't silently widen CI's lint scope
select = ["E4", "E7", "E9", "F"]
